[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "multios-persistence-hunter"
version = "0.1.0"
description = "Cross-platform (Windows/Linux/macOS) persistence enumeration for DFIR and threat hunting, with baseline diffing."
requires-python = ">=3.8"
readme = "README.md"
authors = [{ name = "Diego Reija" }]

[project.scripts]
persistence-hunter = "persistence_hunter.cli:main"

[tool.setuptools]
packages = ["persistence_hunter", "persistence_hunter.hunters"]
